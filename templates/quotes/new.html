{{define "content"}}
<div class="li-card__header" style="border-bottom: none; margin-bottom: var(--space-6); padding-bottom: 0;">
  <div>
    <h1 style="margin: 0; font-size: var(--text-hero); font-weight: 700; color: var(--color-text-primary);">Create New Quote</h1>
    <p style="margin: var(--space-1) 0 0 0; color: var(--color-text-secondary); font-size: var(--text-body);">
      Select a client and configure dates to launch the estimate draft builder
    </p>
  </div>
  <div class="li-card__actions">
    <a href="/quotes" class="li-btn li-btn--secondary">Cancel</a>
  </div>
</div>

<form action="/quotes" method="POST" style="max-width: 600px; margin: 0 auto;">
  <article class="li-card">
    <div class="li-card__header">
      <h2>Quote Specifications</h2>
    </div>

    <div style="margin-bottom: var(--space-4);">
      <label for="client_id">Select Customer *</label>
      <select id="client_id" name="client_id" required>
        <option value="" disabled {{if not .Data.PrefillClientID}}selected{{end}}>-- Select Client --</option>
        {{range .Data.Clients}}
        <option value="{{.ID}}" {{if eq .ID $.Data.PrefillClientID}}selected{{end}}>{{.Name}}</option>
        {{end}}
      </select>
    </div>

    <div class="li-form-row">
      <label for="quote_number">Quote Estimate # *
        <input type="text" id="quote_number" name="quote_number" value="{{.Data.NextNumber}}" required>
      </label>
      <label for="currency">Preferred Currency
        <select id="currency" name="currency">
          <option value="PKR" selected>PKR (Rs)</option>
          <option value="USD">USD ($)</option>
          <option value="EUR">EUR (€)</option>
          <option value="GBP">GBP (£)</option>
        </select>
      </label>
    </div>

    <div class="li-form-row">
      <label for="issue_date">Issue Date *
        <input type="date" id="issue_date" name="issue_date" value="{{.Data.Today}}" required>
      </label>
      <label for="expiry_date">Expiry Date
        <input type="date" id="expiry_date" name="expiry_date" value="{{.Data.ExpiryDate}}">
      </label>
    </div>
  </article>

  <div style="display: flex; justify-content: flex-end; gap: var(--space-3); margin-top: var(--space-6);">
    <button type="submit" class="li-btn li-btn--primary">
      Start Quote Editor ➡️
    </button>
  </div>
</form>
{{end}}
