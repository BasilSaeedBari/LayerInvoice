<header>
  <h3>Record Payment receipt</h3>
  <button class="li-btn li-btn--ghost li-btn--sm" onclick="document.getElementById('app-modal').close()">✕</button>
</header>

<form action="/payments" method="POST">
  <input type="hidden" name="invoice_id" value="{{.Data.InvoiceID}}">

  <div style="background-color: var(--color-status-sent-bg); border: 1px solid #bfdbfe; border-radius: 6px; padding: var(--space-4); margin-bottom: var(--space-4);">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span style="font-weight: 600; color: var(--color-text-secondary);">Invoice Number:</span>
      <span style="font-weight: 700; color: var(--color-text-primary);">{{.Data.InvoiceNumber}}</span>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px;">
      <span style="font-weight: 600; color: var(--color-text-secondary);">Remaining Balance:</span>
      <span style="font-weight: 700; color: var(--color-status-overdue); font-size: var(--text-subheading);" class="li-money">
        Rs {{.Data.BalanceDisplay}}
      </span>
    </div>
  </div>

  <div class="li-form-row">
    <label>Amount Received (PKR) *
      <input type="text" name="amount" value="{{.Data.BalanceDisplay}}" placeholder="0.00" required>
    </label>
    
    <label>Payment Method *
      <select name="payment_method_id" required>
        <option value="" selected>-- Direct Cash --</option>
        {{range .Data.Methods}}
        <option value="{{.ID}}">{{.Name}}</option>
        {{end}}
      </select>
    </label>
  </div>

  <div class="li-form-row" style="margin-top: var(--space-3);">
    <label>Transaction Reference ID
      <input type="text" name="transaction_ref" placeholder="TXN-987654321">
      <small style="color: var(--color-text-secondary);">Bank receipt / slip reference</small>
    </label>
    
    <label>Date Received *
      <input type="date" name="paid_at" value="{{.Data.Today}}" required>
    </label>
  </div>

  <div style="margin-top: var(--space-3);">
    <label>Notes / Comments
      <textarea name="notes" placeholder="Cheque clearance status, bank transfer title details..." rows="2"></textarea>
    </label>
  </div>

  <footer>
    <button type="button" class="li-btn li-btn--secondary" onclick="document.getElementById('app-modal').close()">Cancel</button>
    <button type="submit" class="li-btn li-btn--primary">Save Payment Receipt</button>
  </footer>
</form>
